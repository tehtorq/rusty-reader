[package]
name = "rusty-reader"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37"
ego-tree = "0.11"
epub = "2.1"
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ron = "0.12.2"
scraper = "0.27"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"
log = "0.4"
winit = { version = "0.30", features = ["android-native-activity"] }

[lib]
# `cdylib` is what Android loads; desktop builds use the ordinary library.
crate-type = ["lib", "cdylib"]

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Typesetting is heavy work; keep debug builds pleasant to use.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
